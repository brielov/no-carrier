<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NO CARRIER</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body data-power="off">
    <main class="console">
      <header class="nameplate">
        <h1>NO CARRIER</h1>
        <button id="power" type="button" aria-pressed="false">POWER ON</button>
      </header>

      <div class="deck">
        <section class="crt" aria-label="System log">
          <div class="glass">
            <div id="log" role="log"></div>
            <pre id="diag" hidden></pre>
          </div>
        </section>

        <div class="desk">
          <section id="macros" class="plate" aria-label="Main controls"></section>
          <section id="profiles" class="plate" aria-label="Profiles and timer"></section>
        </div>

        <div id="plan" class="plan-slot"></div>
      </div>

      <div id="racks" class="racks"></div>
    </main>
  </body>
</html>
